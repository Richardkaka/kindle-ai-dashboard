          </table>
        </div>
        <div class="card-body">
          <p class="label">Codex App</p>
          <h2>手动填写</h2>
          <p class="meta">reset 05/27 03:00</p>
          <div class="bar"><span class="bar-6"></span></div>
        </div>
      </article>

      <article class="card">
        <div class="icon-wrap" aria-hidden="true">
          <table class="pxi">
            <tr><td></td><td></td><td></td><td class="on"></td><td></td><td></td><td></td></tr>
            <tr><td class="on"></td><td></td><td></td><td class="on"></td><td></td><td></td><td class="on"></td></tr>
            <tr><td></td><td class="on"></td><td></td><td class="on"></td><td></td><td class="on"></td><td></td></tr>

          </table>
        </div>
        <div class="card-body">
          <p class="label">Claude Code</p>
          <h2>手动填写</h2>
          <p class="meta">ccusage later</p>
          <div class="bar"><span class="bar-4"></span></div>
        </div>
      </article>

      <article class="card compact">
        <div class="icon-wrap" aria-hidden="true">
          <table class="pxi">
            <tr><td></td><td></td><td class="on"></td><td class="on"></td><td></td><td></td><td></td></tr>

        <div class="card-body">
          <p class="label">Weather</p>
          <h2>暂无</h2>
          <p class="meta">Beijing · wttr.in</p>
        </div>
      </article>

      <article class="card compact">
        <div class="icon-wrap" aria-hidden="true">
          <table class="pxi">
            <tr><td class="on"></td><td class="on"></td><td class="on"></td><td class="on"></td><td class="on"></td><td class="on"></td><td class="on"></td></tr>

        <div class="card-body">
          <p class="label">Break</p>
          <h2>专注中</h2>
          <p class="meta">10 分钟后休息</p>
        </div>
      </article>
    </section>

    <section class="today">
      <div class="today-head">
        <div class="today-mark">□</div>
        <h2>Today</h2>
        <span>4 items</span>
      </div>
      <ul>
        <li><span>□</span> 试着用 Kindle 浏览器打开本地看板</li>
        <li><span>□</span> 调整 Codex App 剩余额和重置时间</li>
        <li><span>□</span> 确认天气城市是否正确</li>
        <li><span>□</span> 评估 30 分钟刷新对续航的影响</li>
